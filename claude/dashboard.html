<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Poker Tracker</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="dashboard-page">
    <header class="page-header">
      <h1 class="page-header__title">Dashboard</h1>
      <span class="page-header__subtitle">owen</span>
    </header>

    <main class="main-area">
      <section class="chart-card">
        <h2 class="chart-card__heading">Win / Loss %</h2>
        <p class="chart-card__subheading">Last 6 months, % of buy-in returned</p>

        <div class="legend">
          <span class="legend__item">
            <span class="legend__dot legend__dot--above"></span>
            Above 100%
          </span>
          <span class="legend__item">
            <span class="legend__dot legend__dot--below"></span>
            Below 100%
          </span>
        </div>

        <img class="chart-card__chart" src="assets/win-loss-chart.svg" alt="Win/loss percentage over the last 6 months, green above 100% break-even, red below it" />

        <div class="x-axis-labels">
          <span>Apr</span>
          <span>May</span>
          <span>Jun</span>
          <span>Jul</span>
          <span>Aug</span>
          <span>Sep</span>
        </div>
      </section>

      <section class="stats-grid">
        <div class="stats-grid__row">
          <div class="stat-tile">
            <p class="stat-tile__label">Times Played</p>
            <p class="stat-tile__value">42</p>
          </div>
          <div class="stat-tile">
            <p class="stat-tile__label">Friends</p>
            <p class="stat-tile__value">8</p>
          </div>
        </div>
        <div class="stats-grid__row">
          <div class="stat-tile">
            <p class="stat-tile__label">Money Won</p>
            <p class="stat-tile__value stat-tile__value--positive">+$1,240</p>
          </div>
          <div class="stat-tile">
            <p class="stat-tile__label">Total Buy-In</p>
            <p class="stat-tile__value">$6,150</p>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
