<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>owenschu.com</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <header class="nav-bar">
    <p class="nav-bar__logo">owenschu.com</p>

    <nav class="nav-links" id="navLinks">
      <a class="nav-links__item" href="#projects">Projects</a>
      <a class="nav-links__item" href="#about">About</a>
      <a class="nav-links__item" href="#contact">Contact</a>
    </nav>

    <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navLinks">
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
    </button>
  </header>

  <main class="hero" id="projects">
    <h1 class="hero__title">Hi, I'm Owen — I make things.</h1>
    <p class="hero__subtitle">These are my recent projects I’m working on.</p>

    <div class="project-boxes">
      <div class="project-box">
        <p class="project-box__label">Poker win/loss Tracker</p>
      </div>
      <div class="project-box">
        <p class="project-box__label">sudo bet online - A casino style online RPG</p>
      </div>
      <div class="project-box">
        <p class="project-box__label">Project 3</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p class="footer__copy">© 2026 Your Name. All rights reserved.</p>
    <div class="social-links">
      <a class="social-links__item" href="#">GitHub</a>
      <a class="social-links__item" href="#">LinkedIn</a>
      <a class="social-links__item" href="#">Email</a>
    </div>
  </footer>

  <script>
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');

    navToggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('nav-links--open');
      navToggle.classList.toggle('nav-toggle--open', isOpen);
      navToggle.setAttribute('aria-expanded', String(isOpen));
    });

    navLinks.querySelectorAll('.nav-links__item').forEach((link) => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('nav-links--open');
        navToggle.classList.remove('nav-toggle--open');
        navToggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
</body>
</html>
