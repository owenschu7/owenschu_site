{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Tracker</title>
  <link rel="stylesheet" href="{% static 'poker/css/addPlayers.css' %}">
</head>
<body>
  <div class="phone">
    <header class="title">
      <h1>Poker Tracker</h1>
      <p class="byline">by owen</p>
    </header>

    <main class="main-area">
      <div class="poker-table">
        <img class="table-graphic" src="{% static 'poker/assets/svg/poker-table.svg' %}" alt="Poker table">

        <button class="seat seat-0" type="button" aria-label="Add player, seat 1">
          <img src="{% static 'poker/assets/svg/seat-empty.svg' %}" alt="">
        </button>
        <button class="seat seat-1" type="button" aria-label="Add player, seat 2">
          <img src="{% static 'poker/assets/svg/seat-empty.svg' %}" alt="">
        </button>
        <button class="seat seat-2" type="button" aria-label="Add player, seat 3">
          <img src="{% static 'poker/assets/svg/seat-empty.svg' %}" alt="">
        </button>
        <button class="seat seat-3" type="button" aria-label="Add player, seat 4">
          <img src="{% static 'poker/assets/svg/seat-empty.svg' %}" alt="">
        </button>
        <button class="seat seat-4" type="button" aria-label="Add player, seat 5">
          <img src="{% static 'poker/assets/svg/seat-empty.svg' %}" alt="">
        </button>
        <button class="seat seat-5" type="button" aria-label="Add player, seat 6">
          <img src="{% static 'poker/assets/svg/seat-empty.svg' %}" alt="">
        </button>
        <button class="seat seat-6" type="button" aria-label="Add player, seat 7">
          <img src="{% static 'poker/assets/svg/seat-empty.svg' %}" alt="">
        </button>
        <button class="seat seat-7" type="button" aria-label="Add player, seat 8">
          <img src="{% static 'poker/assets/svg/seat-empty.svg' %}" alt="">
        </button>
      </div>

      <section class="data-card">
        <div class="player-label">owen</div>

        <div class="buy-in">
          <div class="buy-in-row">
            <span class="buy-in-title">buy-in:</span>
            <div class="total-buy-in-display">$0</div>
          </div>
          <div class="buy-in-row">
            <span class="buy-in-title">add-on:</span>
            <input
              class="add-on-input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              value="+$0">
          </div>
        </div>

        <button class="add-value-button" type="button">Add Value</button>
      </section>

      <button class="end-game-button" type="button">End Game</button>
    </main>
  </div>
</body>
</html>
